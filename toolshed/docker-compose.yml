# One command to run the portal with automatic HTTPS:
#
#   cp .env.example .env     # then edit it
#   docker compose up -d
#
# Caddy fetches and renews a certificate for PORTAL_DOMAIN. The portal itself is not
# published on any host port: the only way in is through Caddy.
services:
  toolshed:
    build: .
    restart: unless-stopped
    environment:
      Seed__AdminEmail: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      AllowedHosts: ${PORTAL_DOMAIN:?Set PORTAL_DOMAIN in .env}
      Portal__Name: ${PORTAL_NAME:-The Tool Shed}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM:-}
    volumes:
      - toolshed-data:/app/App_Data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - toolshed
    ports:
      - "80:80"
      - "443:443"
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  toolshed-data:
  caddy-data:
  caddy-config:
