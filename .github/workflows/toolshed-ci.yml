name: ToolShed CI

on:
  push:
    branches: ['**']
    paths:
      - 'toolshed/**'
      - '.github/workflows/toolshed-ci.yml'
  pull_request:
    paths:
      - 'toolshed/**'
      - '.github/workflows/toolshed-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore toolshed/ToolShed.sln

      - name: Build
        run: dotnet build toolshed/ToolShed.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test toolshed/ToolShed.sln --configuration Release --no-build --verbosity normal

      # The website's booking calendar is a small script; its rules are tested on their own with Node's
      # built-in runner (no packages to install). Run from the folder so every Node version finds the tests.
      - name: Calendar rule tests (JavaScript)
        working-directory: toolshed/tests/js
        run: node --test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build toolshed --tag toolshed:ci

      - name: Smoke test the container
        run: |
          docker run -d --name shed -p 8080:8080 -e Seed__AdminEmail=ci@example.test toolshed:ci

          # Pretend to be the TLS-terminating proxy that sits in front in production.
          code=000
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://localhost:8080/Account/Login || true)
            [ "$code" = "200" ] && break
            sleep 1
          done

          docker logs shed
          test "$code" = "200"

          # Anonymous visitors must be bounced to the sign-in page.
          location=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'X-Forwarded-Proto: https' http://localhost:8080/)
          echo "Redirected to: $location"
          echo "$location" | grep -q '/Account/Login'
